name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - codex/full-local-intelligence-lab-desktop

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/run_guardrail_scan.py
