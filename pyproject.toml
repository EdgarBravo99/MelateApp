[project]
name = "melate-app-lab"
version = "0.1.0"
description = "Local review_default intelligence lab for Melate/Revancha postmortems."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["melate_app_lab"]
